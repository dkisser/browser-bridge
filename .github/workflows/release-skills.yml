name: release-skills

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify package.json matches tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG=$(node -p "require('./package.json').version")
          if [[ "v${PKG}" != "${TAG}" ]]; then
            echo "BB-E030: package.json version (${PKG}) does not match tag (${TAG})"
            exit 1
          fi

      - name: Build skills tarball + sha256
        env:
          VERSION: ${{ github.ref_name }}
        run: bash .github/scripts/build-skills-tarball.sh

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            browser-bridge-skills-${{ github.ref_name }}.tar.gz
            browser-bridge-skills-${{ github.ref_name }}.tar.gz.sha256
