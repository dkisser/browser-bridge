name: base-check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: apps/bridge-core/go.sum

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pinned to the version .golangci.yml is written against (v2 config).
      # Uses the official GitHub Action so we ship a single, checksum-
      # verified binary rather than a curl-piped install script whose
      # embedded checksums drift out of sync with the upstream release
      # artefacts (an intermittent checksum mismatch previously failed
      # base-check on otherwise-clean PRs).
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13.2
          cache: false

      # Lint (biome + gofmt + go vet + golangci-lint), type check, and all
      # tests (bun + go test -race) — one umbrella over both toolchains.
      - name: Check
        run: bun run check

      - name: Verify binary compiles
        run: bun run build:binaries
