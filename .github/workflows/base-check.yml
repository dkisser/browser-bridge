name: base-check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: apps/bridge-core/go.sum

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pinned to the version .golangci.yml is written against (v2 config).
      # setup-go puts $(go env GOPATH)/bin on PATH.
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2

      # Lint (biome + gofmt + go vet + golangci-lint), type check, and all
      # tests (bun + go test -race) — one umbrella over both toolchains.
      - name: Check
        run: bun run check

      - name: Verify binary compiles
        run: bun run build:binaries
