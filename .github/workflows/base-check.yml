name: base-check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Run unit/integration tests
        run: bun run test

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: apps/bridge-core/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pinned to the version .golangci.yml is written against (v2 config).
      # setup-go puts $(go env GOPATH)/bin on PATH.
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2

      - name: Go checks (gofmt + vet + golangci-lint + tests)
        run: bun run check:go

      - name: Verify binary compiles
        run: bun run build:binaries
