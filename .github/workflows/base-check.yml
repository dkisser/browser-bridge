name: base-check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Run unit/integration tests
        run: bun run test

      - name: Verify binaries compile
        run: |
          mkdir -p dist
          bun build --compile apps/bridge-core/src/index.ts --outfile dist/bridge-core --target=bun-linux-x64
          bun build --compile apps/cli/src/index.ts --outfile dist/bridge-cmd --target=bun-linux-x64
          test -x dist/bridge-core
          test -x dist/bridge-cmd
