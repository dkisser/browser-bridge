name: install-check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'install/**'
      - '.github/workflows/install-check.yml'
  push:
    branches:
      - main
    paths:
      - 'install/**'
      - '.github/workflows/install-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install -y bats unzip zip

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run install/bridge bats tests
        run: bun run test:install
